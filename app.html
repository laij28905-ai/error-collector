<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f9">
<meta name="description" content="轻量化AI高中错题个性化学习助手 - 拍照录入、AI复盘、间隔复习、离线可用">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234353c8'/%3E%3Ctext x='32' y='42' font-size='30' text-anchor='middle' fill='white'%3E%E9%94%99%3C/text%3E%3C/svg%3E">
<title>错题助手</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="toast" class="toast"></div>

<div id="processingOverlay" class="processing-overlay">
  <div class="processing-box">
    <div class="spinner"></div>
    <div class="proc-title" id="procTitle">处理中</div>
    <div class="proc-desc" id="procDesc">请稍候</div>
  </div>
</div>

<div id="app">
  <header class="app-header">
    <button id="headerBack" class="header-back" onclick="goBack()" aria-label="返回">&#8592;</button>
    <h1 id="headerTitle">错题助手</h1>
    <div class="header-actions">
      <span id="netBadge" class="net-badge online">在线</span>
    </div>
  </header>

  <main id="appContent" class="app-content">
    <!-- 首页 -->
    <section id="page-home" class="page active">
      <div class="home-hero">
        <div>
          <p class="eyebrow" id="todayLabel">今天</p>
          <h2 id="homeGreeting">整理一道错题</h2>
          <span id="streakBadge" class="streak-badge">&#128293; 0 天</span>
        </div>
        <button class="icon-btn add-btn" onclick="goCapture()" aria-label="录入错题">&#43;</button>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <b id="statTotal">0</b>
          <span>全部错题</span>
        </div>
        <div class="stat-card accent">
          <b id="statDue">0</b>
          <span>今日待复习</span>
        </div>
        <div class="stat-card teal">
          <b id="statMastered">0</b>
          <span>已掌握</span>
        </div>
      </div>

      <div class="section-block">
        <div class="section-title">
          <span>薄弱知识点</span>
          <button class="text-btn" onclick="openWeeklyReport()">本周报告</button>
        </div>
        <div id="weakList" class="weak-list"></div>
      </div>

      <div class="quick-grid">
        <button class="quick-card" onclick="navigateTo('capture')">
          <span class="qc-icon">&#128247;</span>
          <span class="qc-title">拍照录入</span>
        </button>
        <button class="quick-card" onclick="navigateTo('review')">
          <span class="qc-icon">&#129504;</span>
          <span class="qc-title">开始复习</span>
        </button>
        <button class="quick-card" onclick="navigateTo('book')">
          <span class="qc-icon">&#128218;</span>
          <span class="qc-title">错题本</span>
        </button>
        <button class="quick-card" onclick="navigateTo('profile')">
          <span class="qc-icon">&#9881;</span>
          <span class="qc-title">AI 设置</span>
        </button>
      </div>

      <div class="section-block">
        <div class="section-title">
          <span>最近录入</span>
          <button class="text-btn" onclick="navigateTo('book')">查看全部</button>
        </div>
        <div id="recentList" class="recent-list"></div>
      </div>
    </section>

    <!-- 拍照录入 -->
    <section id="page-capture" class="page">
      <div id="capturePreview" class="capture-preview">
        <div class="placeholder">
          <div class="pl-icon">&#128247;</div>
          <div class="pl-text">拍照或选择图片</div>
        </div>
      </div>
      <div class="capture-actions">
        <button id="btnCamera" class="btn primary" onclick="startCamera()">&#128247; 拍照</button>
        <button id="btnAlbum" class="btn" onclick="uploadImage()">&#128444; 相册</button>
        <button id="btnPaste" class="btn" onclick="pasteClipboardImage()">&#128203; 粘贴</button>
        <button id="btnCrop" class="btn hidden" onclick="openCropModal()">&#9986; 裁剪</button>
        <button id="btnOcr" class="btn teal hidden" onclick="runOcr()">&#129302; 识别文字</button>
        <button id="btnRetake" class="btn hidden" onclick="retakeCapture()">&#128260; 重拍</button>
      </div>
      <button class="btn outline full" onclick="showManualEntry()">&#9999; 手动输入</button>

      <div id="manualEntry" class="manual-entry hidden">
        <label class="field-label" for="manualText">题目内容</label>
        <textarea id="manualText" rows="5" placeholder="粘贴题目或错题内容"></textarea>
        <button class="btn primary full" onclick="saveManualEntry()">下一步</button>
      </div>
    </section>

    <!-- 错题本 -->
    <section id="page-book" class="page">
      <div class="search-row">
        <input id="searchInput" type="search" placeholder="搜索题目或知识点" oninput="setQuery(this.value)">
      </div>
      <div class="chip-row" id="subjectChips"></div>
      <div class="segmented" id="statusSeg"></div>
      <div id="errorList" class="error-list"></div>
    </section>

    <!-- 复习 -->
    <section id="page-review" class="page">
      <div class="review-head">
        <h2>间隔复习</h2>
        <p id="reviewStatus">暂无待复习错题</p>
      </div>
      <div id="reviewProgress" class="review-progress hidden">
        <div class="progress-track"><div id="reviewFill" class="progress-fill"></div></div>
        <span id="reviewCount">0/0</span>
      </div>
      <div id="reviewCard" class="review-card hidden">
        <div class="review-top">
          <span id="reviewSubject" class="subject-pill">数学</span>
          <span id="reviewMeta" class="review-meta"></span>
        </div>
        <div id="reviewImage" class="review-image hidden"></div>
        <div id="reviewQuestion" class="review-question"></div>
        <div class="review-draft">
          <label class="field-label" for="reviewDraft">自测作答</label>
          <textarea id="reviewDraft" rows="3" placeholder="先写出你的答案或思路，再查看参考答案"></textarea>
        </div>
        <div id="reviewAnswer" class="review-answer hidden">
          <div class="review-answer-label">解析 / 答案</div>
          <div id="reviewAnswerText" class="review-answer-text"></div>
        </div>
      </div>
      <div id="reviewActions" class="review-actions hidden">
        <button class="btn" onclick="toggleReviewAnswer()">&#128065; 答案</button>
        <button class="btn red" onclick="rateReview('again')">再练</button>
        <button class="btn amber" onclick="rateReview('good')">还行</button>
        <button class="btn green" onclick="rateReview('easy')">熟练</button>
      </div>
      <div id="reviewEmpty" class="empty-state hidden">
        <div class="es-icon">&#127881;</div>
        <div class="es-title">本轮复习完成</div>
        <div class="es-desc">今天的任务已经清空</div>
      </div>
    </section>

    <!-- 我的 -->
    <section id="page-profile" class="page">
      <div class="profile-header">
        <div class="profile-avatar">TF</div>
        <div>
          <div class="profile-name">Team Future</div>
          <div class="profile-team">华中科技大学 · 创客训练营</div>
        </div>
      </div>

      <div class="section-block">
        <div class="section-title">学习科目</div>
        <div class="chip-wrap" id="subjectSettings"></div>
      </div>

      <div class="section-block">
        <div class="section-title">应用设置</div>
        <div class="form-card">
          <label class="switch-row">
            <span>打开应用直达拍照页</span>
            <input id="openCaptureOnLaunch" type="checkbox">
          </label>
          <button class="btn primary full" onclick="saveSettings()">保存设置</button>
        </div>
      </div>

      <div class="section-block">
        <div class="section-title">云同步</div>
        <div class="form-card">
          <label class="field-label" for="syncToken">GitHub Token</label>
          <input id="syncToken" type="password" placeholder="用于同步私人 Gist">
          <label class="field-label" for="syncGistId">Gist ID（留空自动创建）</label>
          <input id="syncGistId" type="text" placeholder="首次上传后自动生成">
          <label class="switch-row">
            <span>启动时自动从云端恢复</span>
            <input id="autoSync" type="checkbox">
          </label>
          <button class="btn primary full" onclick="syncUpload()">上传到云端</button>
          <button class="btn outline full" onclick="syncPull(false)">从云端恢复</button>
        </div>
      </div>

      <div class="section-block">
        <div class="section-title">AI 服务</div>
        <div class="form-card">
          <label class="field-label" for="aiEndpoint">接口地址</label>
          <input id="aiEndpoint" type="text" placeholder="https://api.openai.com/v1">
          <label class="field-label" for="aiModel">模型</label>
          <input id="aiModel" type="text" placeholder="gpt-4o-mini">
          <label class="switch-row">
            <span>优先使用 AI 视觉识别</span>
            <input id="useAiOcr" type="checkbox">
          </label>
          <label class="field-label" for="ocrModel">视觉识别模型</label>
          <input id="ocrModel" type="text" placeholder="gpt-4o-mini">
          <label class="field-label" for="aiKey">API Key</label>
          <input id="aiKey" type="password" placeholder="留空则使用离线模板">
          <button class="btn primary full" onclick="saveSettings()">保存设置</button>
        </div>
      </div>

      <div class="section-block">
        <div class="section-title">数据</div>
        <div class="menu-card">
          <button class="menu-item" onclick="exportData()">
            <span class="mi-icon">&#128228;</span>
            <span>导出数据</span>
          </button>
          <button class="menu-item" onclick="importData()">
            <span class="mi-icon">&#128229;</span>
            <span>导入数据</span>
          </button>
          <button class="menu-item" onclick="exportPrintable()">
            <span class="mi-icon">&#128424;</span>
            <span>导出打印版</span>
          </button>
          <button class="menu-item" onclick="exportStudyReport()">
            <span class="mi-icon">&#128202;</span>
            <span>导出学习报告</span>
          </button>
          <button class="menu-item danger" onclick="clearAllData()">
            <span class="mi-icon">&#128465;</span>
            <span>清空数据</span>
          </button>
        </div>
      </div>

      <div class="section-block">
        <div class="section-title">关于</div>
        <div class="menu-card">
          <div class="menu-item static">
            <span class="mi-icon">&#8505;</span>
            <span>v3.5 · Team Future</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <nav class="app-nav">
    <button class="nav-item active" data-page="home" onclick="navigateTo('home')">
      <span class="nav-icon">&#127968;</span>
      <small>首页</small>
    </button>
    <button class="nav-item" data-page="capture" onclick="navigateTo('capture')">
      <span class="nav-icon">&#128247;</span>
      <small>录入</small>
    </button>
    <button class="nav-item" data-page="book" onclick="navigateTo('book')">
      <span class="nav-icon">&#128218;</span>
      <small>错题本</small>
      <span id="navBadge" class="nav-badge hidden">0</span>
    </button>
    <button class="nav-item" data-page="review" onclick="navigateTo('review')">
      <span class="nav-icon">&#129504;</span>
      <small>复习</small>
    </button>
    <button class="nav-item" data-page="profile" onclick="navigateTo('profile')">
      <span class="nav-icon">&#128100;</span>
      <small>我的</small>
    </button>
  </nav>
</div>

<div id="modalOverlay" class="modal-overlay">
  <div class="modal-sheet">
    <div class="modal-head">
      <h3 id="modalTitle"></h3>
      <button class="modal-close" onclick="closeModal()" aria-label="关闭">&#215;</button>
    </div>
    <div id="modalContent"></div>
  </div>
</div>

<input id="fileInput" type="file" accept="image/*" hidden>
<input id="importInput" type="file" accept=".json,application/json" hidden>

<script src="vendor/dexie.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
