<script>
// Dexie ˳    أ    Զ   CDN
(function() {
  var cdnList = [
    'https://cdn.jsdelivr.net/npm/dexie@3.2.6/dist/dexie.js',
    'https://cdnjs.cloudflare.com/ajax/libs/dexie/3.2.6/dexie.min.js',
    'https://unpkg.com/dexie@3.2.6/dist/dexie.js'
  ];
  var i = 0;
  function tryLoad() {
    if (i >= cdnList.length) { console.warn('Dexie      CDN       ʧ  '); return; }
    var s = document.createElement('script');
    s.src = cdnList[i];
    s.onload = function() {
      document.dispatchEvent(new CustomEvent('dexie-loaded'));
    };
    s.onerror = function() { i++; tryLoad(); };
    document.head.appendChild(s);
  }
  tryLoad();
})();
</script>

function startCrop() {
  var img = document.getElementById('cropImg');
  img.src = capturedImage;
  
  img.onload = function() {
    var body = document.getElementById('cropBody');
    var bodyW = body.offsetWidth;
    var bodyH = body.offsetHeight;
    
    //     ͼƬ  Ӧ  Ļ
    var scale = Math.min(bodyW / img.naturalWidth, bodyH / img.naturalHeight);
    img.style.width = (img.naturalWidth * scale) + 'px';
    img.style.height = (img.naturalHeight * scale) + 'px';
    img.style.left = (bodyW - img.naturalWidth * scale) / 2 + 'px';
    img.style.top = (bodyH - img.naturalHeight * scale) / 2 + 'px';
    
    // ͼƬ   ű     ¼
    img._scale = scale;
    
    //   ʾ   ǲ 
    document.getElementById('cropOverlay').classList.add('show');
    
    //     Ĭ  ѡ 򣨾  У 60%   35% ߣ 
    resetCropSelect();
  };
  
  //  ݴ     ͼƬ ѻ  棬onload    ܲ     
  if (img.complete && img.naturalWidth > 0) {
    img.onload();
  }
}

  var body = document.getElementById('cropBody');

  var img = document.getElementById('cropImg');
  var sel = document.getElementById('cropSelect');
  var body = document.getElementById('cropBody');
  
  var sx = parseFloat(sel.style.left) - img.offsetLeft;

  var sw = parseFloat(sel.style.width);
  var sh = parseFloat(sel.style.height);
  
  //  ߽籣  
  if (sw < 20 || sh < 20) { showToast('ѡ  ̫С ˣ      һ  '); return; }
  
  // ת    ԭͼ    
  var scale = img._scale || (img.naturalWidth / img.offsetWidth);
  var cropX = Math.max(0, sx / scale);
  var cropY = Math.max(0, sy / scale);
  var cropW = Math.min(img.naturalWidth - cropX, sw / scale);
  var cropH = Math.min(img.naturalHeight - cropY, sh / scale);
  
  if (cropW < 10 || cropH < 10) { showToast('ѡ  λ ò  ԣ      ¿ ѡ'); return; }
  
  //     ͼƬ
  var canvas = document.createElement('canvas');
  canvas.width = cropW;

  document.getElementById('cropOverlay').classList.remove('show');

  showToast('?  Ѳü     AIʶ  ');
}

var _cropState = null;

function getCropEvent(e) {
  var t = e.touches ? e.touches[0] : e;
  return { x: t.clientX, y: t.clientY, target: e.target };
}

document.addEventListener('mousedown', function(e) { cropDragStart(getCropEvent(e)); });
document.addEventListener('mousemove', function(e) { cropDragMove(getCropEvent(e)); });
document.addEventListener('mouseup', function() { cropDragEnd(); });
document.addEventListener('touchstart', function(e) {
  if (e.target.closest && e.target.closest('#cropOverlay')) {
    cropDragStart(getCropEvent(e));
    e.preventDefault();
  }
}, {passive: false});
document.addEventListener('touchmove', function(e) {
  if (_cropState) { cropDragMove(getCropEvent(e)); e.preventDefault(); }
}, {passive: false});
document.addEventListener('touchend', function() { cropDragEnd(); });

function cropDragStart(e) {
  var overlay = document.getElementById('cropOverlay');
  if (!overlay.classList.contains('show')) return;
  
  var sel = document.getElementById('cropSelect');
  var body = document.getElementById('cropBody');
  var bw = body.offsetWidth, bh = body.offsetHeight;
  var sl = parseFloat(sel.style.left), st = parseFloat(sel.style.top);
  var sw = parseFloat(sel.style.width), sh = parseFloat(sel.style.height);
  
  //         Ƿ   ѡ    
  var isInSel = e.x - body.getBoundingClientRect().left >= sl && e.x - body.getBoundingClientRect().left <= sl + sw &&
                e.y - body.getBoundingClientRect().top >= st && e.y - body.getBoundingClientRect().top <= st + sh;
  
  if (!isInSel) return;
  
  //         Ƿ    ֱ 
  var handle = e.target.closest ? e.target.closest('.cs-handle') : null;
  
  if (handle) {
    //       С
    var dir = '';
    if (handle.classList.contains('cs-h-tl')) dir = 'tl';
    else if (handle.classList.contains('cs-h-tr')) dir = 'tr';
    else if (handle.classList.contains('cs-h-bl')) dir = 'bl';
    else if (handle.classList.contains('cs-h-br')) dir = 'br';
    else if (handle.classList.contains('cs-h-t')) dir = 't';
    else if (handle.classList.contains('cs-h-b')) dir = 'b';
    else if (handle.classList.contains('cs-h-l')) dir = 'l';
    else if (handle.classList.contains('cs-h-r')) dir = 'r';
    
    _cropState = {
      type: 'resize', dir: dir,
      startX: e.x, startY: e.y,
      sx: sl, sy: st, sw: sw, sh: sh
    };
  } else if (e.target === sel || e.target.closest === null) {
    //  ϶ ѡ  
    _cropState = {
      type: 'move',
      startX: e.x, startY: e.y,
      sx: sl, sy: st
    };
  }
}

function cropDragMove(e) {
  if (!_cropState) return;
  var sel = document.getElementById('cropSelect');
  var body = document.getElementById('cropBody');
  var bw = body.offsetWidth, bh = body.offsetHeight;
  var dx = e.x - _cropState.startX;
  var dy = e.y - _cropState.startY;
  var minS = 40;
  
  if (_cropState.type === 'move') {
    var nx = Math.max(0, Math.min(bw - parseFloat(sel.style.width), _cropState.sx + dx));
    var ny = Math.max(0, Math.min(bh - parseFloat(sel.style.height), _cropState.sy + dy));
    sel.style.left = nx + 'px';
    sel.style.top = ny + 'px';
  } else if (_cropState.type === 'resize') {
    var left = _cropState.sx, top = _cropState.sy, right = _cropState.sx + _cropState.sw, bottom = _cropState.sy + _cropState.sh;
    var d = _cropState.dir;
    
    if (d.indexOf('l') >= 0) { left = Math.min(_cropState.sx + dx, right - minS); }
    if (d.indexOf('r') >= 0) { right = Math.max(_cropState.sx + _cropState.sw + dx, left + minS); }
    if (d.indexOf('t') >= 0) { top = Math.min(_cropState.sy + dy, bottom - minS); }
    if (d.indexOf('b') >= 0) { bottom = Math.max(_cropState.sy + _cropState.sh + dy, top + minS); }
    
    //  ߽     
    left = Math.max(0, left);
    top = Math.max(0, top);
    right = Math.min(bw, right);
    bottom = Math.min(bh, bottom);
    
    sel.style.left = left + 'px';
    sel.style.top = top + 'px';
    sel.style.width = (right - left) + 'px';
    sel.style.height = (bottom - top) + 'px';
  }
}

function cropDragEnd() {
  _cropState = null;
}

async function processImage() {
  if (!capturedImage) { showToast('       ջ ѡ  ͼƬ'); return; }

  showProcessing('׼  AIʶ  ...', ' ״ ʹ    Ҫ       ԰   Լ3MB       Ժ ');

  try {
    //    Լ    Tesseract     CDN    ã 
    if (typeof Tesseract === 'undefined') {
      updateProcessing('    ʶ      ...', '   ڼ   OCR   棬 뱣      ͨ  ');
      const tesseractCDNs = [
        'https://unpkg.com/tesseract.js@5/dist/tesseract.min.js',
        'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js',
        'https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js'
      ];
      await loadScript(tesseractCDNs);
    }

    updateProcessing('ʶ    ...', '   ڷ   ͼƬ е     ');
    const result = await Tesseract.recognize(
      capturedImage,
      'chi_sim+eng',
      { logger: m => {
        if (m.status === 'loading tesseract core') {
          updateProcessing('   غ       ...', m.progress ? Math.round(m.progress * 100) + '%' : '');
        }
        if (m.status === 'initializing tesseract') {
          updateProcessing('  ʼ      ...', '');
        }
        if (m.status === 'loading language traineddata') {
          updateProcessing('           ԰ ...', Math.round((m.progress || 0) * 100) + '%');
        }
        if (m.status === 'initializing api') {
          updateProcessing('׼      ...', '');
        }
        if (m.status === 'recognizing text') {
          updateProcessing('    ʶ      ...', `${Math.round((m.progress || 0) * 100)}%`);
        }
      }}
    );

    const text = result.data.text.trim();
    hideProcessing();

    if (!text) {
      showToast('δʶ     ֣      ֶ     ');
      showManualEntry();
      return;
    }

    //      Ʋ  Ŀ
    const guessed = guessSubject(text);

    //         Ի   
    showSaveDialog(text, guessed);

  } catch (err) {
    hideProcessing();
    showToast('OCRʶ  ʧ  : ' + err.message);
    showManualEntry();
  }
}

function guessSubject(text) {
  const keywords = {
    '  ѧ': [/x\b|y\b|    |    |    |    |    |    |    |    |ͳ  |    |    ʽ|    |    |    |   /i],
    '    ': [/ţ  |  ѧ| 糡| ų |  ·|    |    | ٶ |   ٶ |Ħ    |    |ѹǿ|ŷķ|    |      |   /i],
    '  ѧ': [/    |    |  ԭ|  Ӧ|  Һ|Ũ  |mol|Ħ  |    | ֽ | û | л |Ԫ  |ԭ  |    |  ѧ  /i],
    '    ': [/ϸ  |    | Ŵ |DNA|RNA|Ⱦɫ  |   |    |  ̬|    |ø|    |    |  /i],
    'Ӣ  ': [/read|write|listen|speak|grammar|vocabulary|translate|comprehension|essay/i],
    '    ': [/ Ķ |д  |  ʫ|    |    | ޴ |   |    |    |    /i],
    '  ʷ': [/    |    |ս  | ⽨| ۹ | ۹ |    |    |ר  | ĸ | ䷨/i],
    '    ': [/    |    |  ѧ| Ļ |    |    | г |    | ƶ |Ȩ  |    /i],
    '    ': [/    |    |    | ˿ |    |ũҵ|  ҵ|  ͨ|   |    |  γ/i]
  };

  const scores = {};
  for (const [subject, patterns] of Object.entries(keywords)) {
    scores[subject] = patterns.reduce((s, p) => s + (p.test(text) ? 1 : 0), 0);
  }

  const best = Object.entries(scores).sort((a, b) => b[1] - a[1])[0];
  return best && best[1] > 0 ? best[0] : '';
}

      <div style="background:var(--bg-input);border-radius:8px;padding:12px;font-size:0.85rem;line-height:1.7;color:var(--accent-2)">${escapeHtml(error.answer)}</div>
    </div>` : ''}
    ${error.image ? `<div class="form-group"><label>ԭʼͼƬ</label><img src="${error.image}" style="width:100%;border-radius:8px;border:1px solid var(--border-color)"></div>` : ''}
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn-danger" onclick="deleteError(${id})" style="flex:1">ɾ  </button>
      <button class="cam-btn outline" onclick="closeDetailModal()" style="flex:1;justify-content:center"> ر </button>
    </div>
  `;

  document.getElementById('detailModal').classList.add('show');
}

function closeDetailModal() {
  document.getElementById('detailModal').classList.remove('show');
}

async function deleteError(id) {
  if (!confirm('ȷ  Ҫɾ            ')) return;
  if (!db) { showToast('   ݿ δ  ʼ  '); return; }
  await db.errors.delete(Number(id));
  closeDetailModal();
  showToast('  ɾ  ');
  await loadErrors();
  updateHomeStats();
  updateRecentList();
  updateNavBadge();
  renderErrorList();
}

function initReview() {
  reviewQueue = allErrors.filter(e => e.status !== 'mastered');
  //  ȸ ϰ  δ  ϰ   ģ  ٸ ϰstruggled
  reviewQueue.sort((a, b) => {
    if (a.status === 'unreviewed' && b.status !== 'unreviewed') return -1;
    if (b.status === 'unreviewed' && a.status !== 'unreviewed') return 1;
    return 0;
  });
  reviewIndex = 0;
  reviewAnswerShown = false;

  if (reviewQueue.length === 0) {
    document.getElementById('reviewCard').style.display = 'none';
    document.getElementById('reviewActions').style.display = 'none';
    document.getElementById('reviewProgress').style.display = 'none';
    document.getElementById('reviewEmpty').style.display = 'block';
    document.getElementById('reviewStatus').textContent = '   д  ⶼ       ??';
    return;
  }

  document.getElementById('reviewEmpty').style.display = 'none';
  document.getElementById('reviewCard').style.display = 'block';
  document.getElementById('reviewActions').style.display = 'flex';
  document.getElementById('reviewProgress').style.display = 'flex';
  document.getElementById('reviewStatus').textContent = `   ${reviewQueue.length}          ϰ`;

  showReviewItem();
}

function showReviewItem() {
  if (reviewIndex >= reviewQueue.length) {
    showToast('??    ָ ϰ  ɣ ');
    initReview();
    return;
  }

  const item = reviewQueue[reviewIndex];
  document.getElementById('rcSubject').textContent = `${item.subject}    ${item.topic}`;
  document.getElementById('rcQuestion').textContent = item.text;
  document.getElementById('rcAnswerText').textContent = item.answer || 'δ  ¼    ';
  document.getElementById('rcAnswer').classList.remove('show');
  reviewAnswerShown = false;

  document.getElementById('rpFill').style.width = `${((reviewIndex) / reviewQueue.length) * 100}%`;
  document.getElementById('rpText').textContent = `${reviewIndex + 1}/${reviewQueue.length}`;
}

function toggleAnswer() {
  const el = document.getElementById('rcAnswer');
  reviewAnswerShown = !reviewAnswerShown;
  el.classList.toggle('show');
}

async function markReview(status) {
  const item = reviewQueue[reviewIndex];
  if (!item) return;
  if (!db) { showToast('   ݿ δ  ʼ  '); return; }

  await db.errors.update(item.id, { status });
  item.status = status;
  reviewIndex++;

  showReviewItem();
  updateHomeStats();
  updateNavBadge();
}

function updateHomeStats() {
  const total = allErrors.length;
  const subjects = new Set(allErrors.map(e => e.subject)).size;
  const mastered = allErrors.filter(e => e.status === 'mastered').length;

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statSubjects').textContent = subjects;
  document.getElementById('statMastered').textContent = mastered;
}

function updateRecentList() {
  const container = document.getElementById('recentList');
  const recent = allErrors.slice(0, 5);

  if (recent.length === 0) {
    container.innerHTML = `<div class="empty-state" style="padding:20px"><div class="es-desc">  û д  ⣬ȥ    ¼   </div></div>`;
    return;
  }

  container.innerHTML = recent.map(e => {
    const colorClass = SUBJECT_COLORS[e.subject] || 'subject-default';
    const icon = SUBJECT_ICONS[e.subject] || '?';
    return `<div class="recent-item" onclick="showErrorDetail('${e.id}')">
      <div class="ri-subject ${colorClass}">${icon}</div>
      <div class="ri-info">
        <div class="ri-title">${escapeHtml(e.text.slice(0, 30))}${e.text.length > 30 ? '...' : ''}</div>
        <div class="ri-meta">${escapeHtml(e.subject)}    ${escapeHtml(e.topic)}</div>
      </div>
      <div class="ri-time">${e.date}</div>
    </div>`;
  }).join('');
}

function updateNavBadge() {
  const unreviewed = allErrors.filter(e => e.status !== 'mastered').length;
  const badge = document.getElementById('navBadge');
  if (unreviewed > 0) {
    badge.textContent = unreviewed;
    badge.style.display = '';
  } else {
    badge.style.display = 'none';
  }
}

function renderSubjectTags() {
  const container = document.getElementById('subjectTags');
  container.innerHTML = SUBJECTS.map(s => `
    <button class="subject-tag ${selectedSubjects.includes(s) ? 'active' : ''}"
      onclick="toggleSubject('${s}')">${s}</button>
  `).join('');

  // ͬʱ  Ⱦɸѡ  ť
  renderFilterButtons();
}

function toggleSubject(subject) {
  const idx = selectedSubjects.indexOf(subject);
  if (idx >= 0) {
    selectedSubjects.splice(idx, 1);
  } else {
    selectedSubjects.push(subject);
  }
  renderSubjectTags();
  renderErrorList();
  renderFilterButtons();
  updateHomeStats();
}

async function clearAllData() {
  if (!db) { showToast('   ݿ δ  ʼ  '); return; }
  await db.errors.clear();
  allErrors = [];
  updateHomeStats();
  updateRecentList();
  updateNavBadge();
  renderErrorList();
  showToast('             ');
}

function exportData() {
  if (allErrors.length === 0) {
    showToast('û     ݿɵ   ');
    return;
  }
  const data = JSON.stringify(allErrors, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `        _${new Date().toLocaleDateString('zh-CN')}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('??      ѵ   ');
}
