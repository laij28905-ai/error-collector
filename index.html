<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>轻量化AI高中错题个性化学习助手</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0a0e27;
    color: #fff;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  /* 背景粒子 */
  #particles-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* 背景渐变 */
  .bg-glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.15;
    pointer-events: none;
    z-index: 0;
  }
  .bg-glow-1 {
    width: 600px; height: 600px;
    background: #6366f1;
    top: -200px; right: -150px;
    animation: glowFloat 20s ease-in-out infinite;
  }
  .bg-glow-2 {
    width: 500px; height: 500px;
    background: #06b6d4;
    bottom: -200px; left: -150px;
    animation: glowFloat 25s ease-in-out infinite reverse;
  }
  .bg-glow-3 {
    width: 400px; height: 400px;
    background: #8b5cf6;
    bottom: 20%; right: 10%;
    animation: glowFloat 18s ease-in-out infinite 5s;
  }

  @keyframes glowFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -50px) scale(1.1); }
    66% { transform: translate(-20px, 30px) scale(0.9); }
  }

  /* 主容器 */
  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    padding: 2rem;
    text-align: center;
  }

  /* 顶部标签 */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 20px;
    border-radius: 100px;
    background: rgba(99, 102, 241, 0.15);
    border: 1px solid rgba(99, 102, 241, 0.25);
    font-size: 0.85rem;
    font-weight: 500;
    color: #a5b4fc;
    letter-spacing: 1px;
    margin-bottom: 2rem;
    opacity: 0;
    animation: fadeSlideUp 0.8s ease 0.2s forwards;
  }
  .badge .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #22d3ee;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* 主标题 */
  .main-title {
    font-size: clamp(2.2rem, 5vw, 3.8rem);
    font-weight: 800;
    line-height: 1.2;
    margin-bottom: 1rem;
    opacity: 0;
    animation: fadeSlideUp 0.8s ease 0.4s forwards;
  }
  .main-title .highlight {
    background: linear-gradient(135deg, #818cf8, #22d3ee);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* 副标题 */
  .subtitle {
    font-size: clamp(0.95rem, 1.5vw, 1.15rem);
    font-weight: 300;
    color: rgba(255,255,255,0.5);
    max-width: 640px;
    line-height: 1.7;
    margin-bottom: 3rem;
    opacity: 0;
    animation: fadeSlideUp 0.8s ease 0.6s forwards;
  }

  /* 特性列表 */
  .features {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 3rem;
    opacity: 0;
    animation: fadeSlideUp 0.8s ease 0.8s forwards;
  }
  .feature-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    border-radius: 100px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    font-size: 0.85rem;
    font-weight: 400;
    color: rgba(255,255,255,0.6);
  }
  .feature-item .icon {
    font-size: 1rem;
  }

  /* 按钮 */
  .btn-start {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 16px 48px;
    border-radius: 60px;
    border: none;
    background: linear-gradient(135deg, #6366f1, #06b6d4);
    color: #fff;
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    opacity: 0;
    animation: fadeSlideUp 0.8s ease 1.0s forwards;
    position: relative;
    overflow: hidden;
  }
  .btn-start::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(135deg, #818cf8, #22d3ee);
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .btn-start:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(99, 102, 241, 0.35);
  }
  .btn-start:hover::before {
    opacity: 1;
  }
  .btn-start span {
    position: relative;
    z-index: 1;
  }
  .btn-start .arrow {
    position: relative;
    z-index: 1;
    transition: transform 0.3s ease;
  }
  .btn-start:hover .arrow {
    transform: translateX(4px);
  }

  /* 底部信息 */
  .footer {
    position: fixed;
    bottom: 2rem;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.8rem;
    color: rgba(255,255,255,0.2);
    z-index: 1;
    opacity: 0;
    animation: fadeSlideUp 0.8s ease 1.4s forwards;
  }
  .footer .team {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .footer .sep {
    margin: 0 8px;
    opacity: 0.3;
  }

  /* 动画 */
  @keyframes fadeSlideUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* 响应式 */
  @media (max-width: 640px) {
    .features { gap: 0.6rem; }
    .feature-item { padding: 6px 14px; font-size: 0.78rem; }
    .btn-start { padding: 14px 36px; font-size: 1rem; }
  }
</style>
</head>
<body>

  <!-- 背景光晕 -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-glow bg-glow-3"></div>

  <!-- 粒子画布 -->
  <canvas id="particles-canvas"></canvas>

  <!-- 主要内容 -->
  <div class="container">
    <div class="badge">
      <span class="dot"></span>
      华中科技大学 · 创客训练营
    </div>

    <h1 class="main-title">
      轻量化<span class="highlight">AI</span>高中<br>
      错题个性化学习助手
    </h1>

    <p class="subtitle">
      拍照归集 · 智能分类 · 变式训练 ·
      学情分析 —— 轻量极简，为每一位高中生量身定制的AI错题管家
    </p>

    <div class="features">
      <div class="feature-item"><span class="icon">📸</span> AI拍照识别</div>
      <div class="feature-item"><span class="icon">📂</span> 自动归类</div>
      <div class="feature-item"><span class="icon">✏️</span> 变式训练</div>
      <div class="feature-item"><span class="icon">📊</span> 学情报表</div>
      <div class="feature-item"><span class="icon">🌙</span> 离线可用</div>
    </div>

    <button class="btn-start" onclick="enterApp()">
      <span>开始使用</span>
      <span class="arrow">→</span>
    </button>
  </div>

  <!-- 底部 -->
  <div class="footer">
    <span class="team">Team Future</span>
    <span class="sep">·</span>
    <span>姜来 · 王子然 · 王冠杨</span>
    <span class="sep">·</span>
    <span>2026</span>
  </div>

  <script>
    // 粒子系统
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let animationId;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.speedY = (Math.random() - 0.5) * 0.3;
        this.opacity = Math.random() * 0.5 + 0.1;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
          this.reset();
        }
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(165, 180, 252, ${this.opacity})`;
        ctx.fill();
      }
    }

    function initParticles() {
      particles = [];
      const count = Math.min(80, Math.floor(canvas.width * canvas.height / 12000));
      for (let i = 0; i < count; i++) {
        particles.push(new Particle());
      }
    }

    function drawConnections() {
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 150) {
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = `rgba(165, 180, 252, ${0.08 * (1 - dist / 150)})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      drawConnections();
      animationId = requestAnimationFrame(animateParticles);
    }

    initParticles();
    animateParticles();

    window.addEventListener('resize', () => {
      resizeCanvas();
      initParticles();
    });

    // 进入应用
    function enterApp() {
      const btn = document.querySelector('.btn-start');
      btn.style.transform = 'scale(0.95)';
      btn.style.opacity = '0.5';
      setTimeout(() => {
        window.location.href = 'app.html';
        btn.style.transform = '';
        btn.style.opacity = '';
      }, 300);
    }
  </script>
</body>
</html>
