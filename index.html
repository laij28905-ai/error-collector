<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ee">
<meta name="description" content="轻量化AI高中错题个性化学习助手 - Team Future">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234353c8'/%3E%3Ctext x='32' y='42' font-size='30' text-anchor='middle' fill='white'%3E%E9%94%99%3C/text%3E%3C/svg%3E">
<title>轻量化AI高中错题个性化学习助手</title>
<style>
  :root {
    --ink: #1e2434;
    --muted: #6c7284;
    --paper: #f7f4ee;
    --card: #ffffff;
    --line: #e7e2d8;
    --indigo: #4353c8;
    --teal: #0f8f84;
    --coral: #d9623f;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html,
  body {
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: var(--paper);
    color: var(--ink);
    overflow: hidden;
  }

  #scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px 88px;
    text-align: center;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 22px;
  }

  .badge .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--coral);
  }

  h1 {
    font-size: clamp(34px, 8vw, 58px);
    line-height: 1.18;
    letter-spacing: 0;
    max-width: 720px;
  }

  h1 .ai {
    color: var(--indigo);
  }

  .subtitle {
    margin-top: 16px;
    max-width: 520px;
    font-size: 15px;
    line-height: 1.75;
    color: var(--muted);
  }

  .features {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 26px;
  }

  .feature {
    padding: 8px 16px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--line);
    font-size: 13px;
    color: var(--ink);
    font-weight: 600;
  }

  .feature:nth-child(1) {
    color: var(--indigo);
  }

  .feature:nth-child(2) {
    color: var(--teal);
  }

  .feature:nth-child(3) {
    color: var(--coral);
  }

  .start-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 34px;
    padding: 15px 34px;
    border-radius: 12px;
    border: 0;
    background: var(--ink);
    color: #fff;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 14px 32px rgba(30, 36, 52, 0.22);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }

  .start-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 18px 40px rgba(30, 36, 52, 0.28);
  }

  .start-btn:active {
    transform: scale(0.97);
  }

  .footer {
    position: fixed;
    bottom: 26px;
    left: 0;
    right: 0;
    z-index: 1;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }

  .footer b {
    color: var(--ink);
  }

  @media (max-width: 480px) {
    .page {
      padding-top: 40px;
    }

    h1 {
      font-size: 34px;
    }

    .subtitle {
      font-size: 14px;
    }

    .features {
      gap: 8px;
    }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="page">
  <div class="badge">
    <span class="dot"></span>
    华中科技大学 · Team Future
  </div>
  <h1>轻量化<span class="ai">AI</span>高中<br>错题个性化学习助手</h1>
  <p class="subtitle">拍照归集错题、AI 复盘错因、间隔复习巩固，离线也能持续记录。</p>
  <div class="features">
    <span class="feature">拍照录入</span>
    <span class="feature">AI 复盘</span>
    <span class="feature">举一反三</span>
    <span class="feature">间隔复习</span>
    <span class="feature">离线可用</span>
  </div>
  <button class="start-btn" onclick="enterApp()">
    开始使用
    <span>→</span>
  </button>
</div>

<div class="footer">
  <b>Team Future</b> · 姜来 · 王子然 · 王冠杨 · 2026
</div>

<script>
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const symbols = ['∑', '∫', 'π', '∞', 'f(x)', 'H₂O', 'DNA', '∠', '√', 'Δ', 'e=mc²', 'θ', 'dy/dx', 'CO₂'];
  const colors = ['#4353c8', '#0f8f84', '#d9623f', '#8b6f2e', '#5470c6'];
  let particles = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function makeParticle() {
    return {
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 0.35,
      vy: (Math.random() - 0.5) * 0.35,
      size: 14 + Math.random() * 22,
      opacity: 0.08 + Math.random() * 0.14,
      color: colors[Math.floor(Math.random() * colors.length)],
      symbol: symbols[Math.floor(Math.random() * symbols.length)]
    };
  }

  function init() {
    resize();
    const count = Math.min(34, Math.floor(canvas.width * canvas.height / 36000));
    particles = Array.from({ length: count }, makeParticle);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < -40) p.x = canvas.width + 40;
      if (p.x > canvas.width + 40) p.x = -40;
      if (p.y < -40) p.y = canvas.height + 40;
      if (p.y > canvas.height + 40) p.y = -40;
      ctx.globalAlpha = p.opacity;
      ctx.fillStyle = p.color;
      ctx.font = `600 ${p.size}px -apple-system, "Microsoft YaHei", sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(p.symbol, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', init);
  init();
  draw();

  function enterApp() {
    window.location.href = 'app.html';
  }
</script>
</body>
</html>
