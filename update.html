<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#f7f8f4"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23315b48'/%3E%3C/svg%3E"><title>更新错题助手</title>
<style>body{margin:0;background:#f7f8f4;color:#243d32;font:16px/1.7 system-ui,sans-serif;padding:48px 22px}main{max-width:440px;margin:auto;background:white;border:1px solid #e0e5db;border-radius:20px;padding:26px}h1{font-size:24px;margin:0 0 16px}p{color:#627068}button{width:100%;padding:15px;border:0;border-radius:12px;background:#315b48;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.6}a{color:#315b48}small{display:block;margin:20px 0;color:#627068}#status{overflow-wrap:anywhere}</style></head>
<body><main><h1>更新错题助手</h1><p>更新题卡名称和举一反三作答页，支持作答照片与练习记录。</p><p>更新保留当前浏览器里的错题、图片和设置。请先保存其他窗口中尚未保存的内容。</p><button id="updateButton" onclick="updateApp()">更新应用，保留错题</button><p id="status" role="status">请保持联网。无需清除浏览器数据。</p><small>目标版本：10.31 举一反三作答</small><a href="./app.html#profile">返回应用</a></main>
<script>
const targetVersion = 'practice-v1';
function workerVersion(worker) {
  return new Promise(resolve => {
    if (!worker) { resolve(''); return; }
    const channel = new MessageChannel();
    const timer = setTimeout(() => {channel.port1.close();resolve('');}, 700);
    channel.port1.onmessage = event => {clearTimeout(timer);channel.port1.close();resolve(event.data?.version || '');};
    worker.postMessage({type:'GET_VERSION'}, [channel.port2]);
  });
}
async function updateApp() {
  const button = document.getElementById('updateButton'), status = document.getElementById('status');
  button.disabled = true;
  let timer;
  try {
    if (!navigator.onLine) throw Error('当前离线，请联网后重试。已保存错题不会受影响。');
    if (!window.isSecureContext || !('serviceWorker' in navigator)) throw Error('请用支持离线应用的浏览器，通过 HTTPS 打开此页面。');
    status.textContent = '正在下载新版页面，保留本地错题…';
    const registration = await Promise.race([navigator.serviceWorker.register('./sw.js', {updateViaCache:'none'}),new Promise((_,reject)=>{timer=setTimeout(()=>reject(Error('更新连接超时，请联网后重试。')),25000);})]);
    clearTimeout(timer);
    await Promise.race([registration.update(),new Promise((_,reject)=>{timer=setTimeout(()=>reject(Error('检查更新超时，请稍后重试。')),25000);})]);
    clearTimeout(timer);
    const until = Date.now() + 30000;
    while (Date.now() < until) {
      if (registration.waiting) registration.waiting.postMessage({type:'APPLY_UPDATE'});
      if (await workerVersion(navigator.serviceWorker.controller) === targetVersion) {
        status.textContent = '新版已准备好，正在打开…';
        location.replace('./app.html?release=' + targetVersion + '#profile'); return;
      }
      await new Promise(resolve => setTimeout(resolve, 250));
    }
    throw Error('新版尚未就绪，请检查网络后重试。没有删除任何错题或设置。');
  } catch (error) { status.textContent = error.message; }
  finally { clearTimeout(timer); button.disabled = false; }
}
</script></body></html>
